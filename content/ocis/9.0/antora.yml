name: ocis
title: Infinite Scale Documentation
version: '9.0'
prerelease: true
display_version: '9.0 (dev)'
start_page: ROOT:index.adoc
nav:
- modules/ROOT/partials/nav.adoc

asciidoc:
  attributes:
    # Audit-tracking attributes: every page that was reviewed or updated for this
    # version carries `:lastUpdatedVersion: {ocis-audit-version}` and
    # `:lastUpdatedDate: {ocis-audit-date}` in its header. Centralising the values
    # here means a single edit covers all pages at once.
    #
    # Update these values when you have verified that ALL content that requires a
    # review has been checked or updated — for example, that Mermaid diagrams,
    # architecture descriptions and configuration examples are still accurate for
    # the new version. Do NOT bump these values for purely mechanical edits
    # (formatting, typo fixes) that do not involve a content review.
    ocis-audit-version: '9.0.0-rc.1'
    ocis-audit-date: '2026-10-25'

    # used to define the include path for services without trailing /
    # note that any changes of this path also need adjustment in
    # https://github.com/owncloud/ocis-charts/tree/master/charts/ocis/docs
    s-path: 'deployment/services/s-list'

    # same as s-path but for the developer documentation
    dev-s-path: 'services/s-list'

    # only used in the developer docs via partials/services/compute-links.adoc
    # path component to the service folder in the ocis repo, used to link the services README
    dev_ocis_services_path: '/services/'

    # the name of the sub directory that defines the sources folder used in the compose deployment examples
    ocis_wopi: 'ocis_full'

    ocis_helpers: 'ocis_helpers'   # note the preceding 'example$' (family coordinate) cant be used as part of the attribute
    ocis_helpers_adoc: '{ocis_helpers}/adoc/'
    ocis_helpers_env_var_deltas: '{ocis_helpers}/env_var_deltas/'
    ocis_helpers_extended: '{ocis_helpers}/extended/'
    ocis_helpers_yaml: '{ocis_helpers}/yaml/'

    # this is the first part of the name for envvars between major versions that will be added or removed
    # example for full name: (old-new.adoc) 8.2.0-9.0.0-added.adoc or 8.2.0-9.0.0-removed.adoc
    # note that the name must be exactly how it is defined in the ocis repo to access the source files!
    # used in e.g. env-var-changes.adoc
    env_var_delta_old: '8.2.0'
    env_var_delta_new: '9.0.0'

    # set attributes defining path components which will be assembled in the document
    compose_url: 'https://github.com/owncloud/ocis/tree/'
    compose_raw_url: 'https://raw.githubusercontent.com/owncloud/ocis/refs/heads/'
    compose_final_path: '/deployments/examples'

    # only used in deployment/services via partials/env-and-yaml.adoc
    # static path components, used to assemble the final path dependent on service_url_component to include services
    ocis_services_raw_url: 'https://raw.githubusercontent.com/owncloud/ocis/refs/heads/'

    # production and rolling have separate paths when it comes to download from docker
    docker_ocis_prod_url: 'https://hub.docker.com/r/owncloud/ocis'
    docker_ocis_rolling_url: 'https://hub.docker.com/r/owncloud/ocis-rolling'

    # used in depl-examples
    download-gh-directory-url: 'https://download-directory.github.io'

    # the url to download ocis
    # note that this is inactive but required in the migration section for upgrading old binaries which do not longer exist.
    ocis-downloadpage-url: 'https://download.owncloud.com/ocis/ocis'

# The collector fetches the Libre Graph API OpenAPI spec from the source repository and places it
# in the developer module's attachments family so the swagger-ui extension can render it on the
# libre-graph-api page. See https://github.com/owncloud/libre-graph-api for the source repository.
#
# A git ls-remote check avoids downloading when the remote SHA matches the cached SHA.
# The download is only accepted if the file is non-empty. The build only fails if the cache is
# empty AND the fetch fails.
ext:
  collector:
  - run:
      command: |
        mkdir -p .cache/libre-graph build/libre-graph
        CACHE=".cache/libre-graph/v1.0.yaml"
        SHA_FILE=".cache/libre-graph/main.sha"
        REMOTE_SHA=$(git ls-remote https://github.com/owncloud/libre-graph-api refs/heads/main 2>/dev/null | awk '{print $1}')
        CACHED_SHA=$(cat "$SHA_FILE" 2>/dev/null || echo "")
        if [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" != "$CACHED_SHA" ] || [ ! -f "$CACHE" ]; then
          if curl -sLf \
            https://raw.githubusercontent.com/owncloud/libre-graph-api/main/api/openapi-spec/v1.0.yaml \
            -o "${CACHE}.new" 2>/dev/null && \
            [ -s "${CACHE}.new" ]; then
            mv "${CACHE}.new" "$CACHE"
            [ -n "$REMOTE_SHA" ] && echo "$REMOTE_SHA" > "$SHA_FILE"
          fi
        fi
        cp "$CACHE" build/libre-graph/v1.0.yaml
      shell: true
    scan:
      dir: build/libre-graph
      into: modules/developer/attachments

  # The collector fetches the phpDocumentor-generated HTML reference from the ocis-php-sdk source
  # repository and places it in the developer module's attachments family so it can be embedded
  # via iframe on the clients/ocis-php-sdk/ocis-php-sdk-docs page.
  # See https://github.com/owncloud/ocis-php-sdk for the source repository.
  #
  # The whole-repo tarball is downloaded and only the docs/ subtree is extracted.
  # The tarball is cached in .cache/ocis-php-sdk/: if the network is unavailable, the last
  # successful download is reused silently. The build only fails if the cache is empty AND
  # the fetch fails.
  - run:
      command: |
        rm -rf build/ocis-php-sdk/ocis-php-sdk-docs
        mkdir -p .cache/ocis-php-sdk build/ocis-php-sdk/ocis-php-sdk-docs
        CACHE=".cache/ocis-php-sdk/main.tar.gz"
        SHA_FILE=".cache/ocis-php-sdk/main.sha"
        REMOTE_SHA=$(git ls-remote https://github.com/owncloud/ocis-php-sdk refs/heads/main 2>/dev/null | awk '{print $1}')
        CACHED_SHA=$(cat "$SHA_FILE" 2>/dev/null || echo "")
        if ([ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$CACHED_SHA" ]) || [ ! -f "$CACHE" ]; then
          [ -n "$REMOTE_SHA" ] \
            && URL="https://github.com/owncloud/ocis-php-sdk/archive/${REMOTE_SHA}.tar.gz" \
            || URL="https://github.com/owncloud/ocis-php-sdk/archive/refs/heads/main.tar.gz"
          if curl -sLf "$URL" -o "${CACHE}.new" 2>/dev/null; then
            TOP=$(tar -tzf "${CACHE}.new" 2>/dev/null | head -1 | cut -d/ -f1)
            if tar -tzf "${CACHE}.new" 2>/dev/null | grep -q "^${TOP}/docs/"; then
              mv "${CACHE}.new" "$CACHE"
              [ -n "$REMOTE_SHA" ] && echo "$REMOTE_SHA" > "$SHA_FILE"
            fi
          fi
        fi
        TOP=$(tar -tzf "$CACHE" 2>/dev/null | head -1 | cut -d/ -f1)
        tar -xzf "$CACHE" \
          --strip-components=2 \
          -C build/ocis-php-sdk/ocis-php-sdk-docs \
          "${TOP}/docs"
      shell: true
    scan:
      dir: build/ocis-php-sdk
      into: modules/developer/attachments
