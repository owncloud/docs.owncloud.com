# Upstream sync manifest -- RETIRED, HISTORICAL RECORD ONLY
# =====================================================================
# The upstream sync is retired: `.github/workflows/sync-upstream.yml` has been
# deleted and nothing consumes this file automatically any more. Documentation
# is now authored in this repo -- `content/<product>/<version>/modules/` is
# hand-edited here, not mirrored.
#
# This file is kept as provenance: it records which upstream repo and branch
# each version folder was last imported from, which is what you need when
# comparing a folder against its legacy origin. Do NOT run sync/sync-repo.sh
# against it -- the mirror is destructive (`rm -rf` + `cp -a`) and would wipe
# every edit made in this repo since the cutover.
#
# ---------------------------------------------------------------------
# Historical description of the mechanism (no longer active):
#
# Active documentation contributions still land in the legacy
# `owncloud/docs-*` repos. This manifest is the single source of truth for
# mapping each upstream repo+branch onto a folder in this monorepo, and is
# consumed by sync/sync-repo.sh and .github/workflows/sync-upstream.yml.
#
# Sync is MIRROR / REPLACE: for every mapping, the directories listed in
# `sync_paths` are deleted from `dest` and re-copied from the upstream branch.
# Upstream always wins; stale files are removed. Everything else in `dest`
# (notably the monorepo-managed antora.yml) is left untouched.
#
# Adding a new maintained version = add one mapping entry here. Creating the
# matching dest folder's antora.yml is a one-time manual step (out of scope).
#
# NOTE: `master` is the in-development / `next` line for each product. Where a
# product has cut a release branch, that branch feeds the matching numbered
# folder and `master` feeds a separate `(dev)` folder. Some products
# (ios/android) name their prerelease line as a numbered branch already, so
# their `(dev)` folder is fed from that branch, not `master`. Verify these rows
# when versions roll over.

# Directories inside each dest folder that are mirrored from upstream.
# antora.yml is intentionally NOT listed -> never overwritten.
sync_paths:
  - modules

repos:
  - name: docs-main
    url: https://github.com/owncloud/docs-main.git
    mappings:
      - { branch: master, dest: content/main }

  - name: docs-server
    url: https://github.com/owncloud/docs-server.git
    mappings:
      - { branch: '10.16', dest: content/server/10.16 }
      # no 11.0 release branch upstream yet -- master still is the 11.0 line
      - { branch: master,  dest: content/server/11.0 }

  - name: docs-ocis
    url: https://github.com/owncloud/docs-ocis.git
    mappings:
      - { branch: '7.3',  dest: content/ocis/7.3 }
      - { branch: '8.0',  dest: content/ocis/8.0 }
      - { branch: '8.1',  dest: content/ocis/8.1 }
      - { branch: '8.2',  dest: content/ocis/8.2 }   # latest release (2026-08-10)
      - { branch: master, dest: content/ocis/8.3 }   # next / (dev)

  - name: docs-webui
    url: https://github.com/owncloud/docs-webui.git
    mappings:
      - { branch: master, dest: content/webui }

  - name: docs-client-desktop
    url: https://github.com/owncloud/docs-client-desktop.git
    mappings:
      - { branch: '5.3',  dest: content/desktop/5.3 }
      - { branch: '6.0',  dest: content/desktop/6.0 }
      - { branch: '7.1',  dest: content/desktop/7.1 }
      - { branch: master, dest: content/desktop/7.2 }   # next / (dev)

  - name: docs-client-ios-app
    url: https://github.com/owncloud/docs-client-ios-app.git
    mappings:
      - { branch: '12.6', dest: content/ios/12.6 }
      - { branch: '12.7', dest: content/ios/12.7 }   # latest release (2026-05-19)

  - name: docs-client-android
    url: https://github.com/owncloud/docs-client-android.git
    mappings:
      - { branch: '4.7',  dest: content/android/4.7 }
      - { branch: '4.8',  dest: content/android/4.8 }   # prerelease line (dev)
