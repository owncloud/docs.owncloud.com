# mapping of envvar prefixes to service names, used by the 'deltas' task of the ocis_helpers go program
#
# the generated tables reference the service an envvar belongs to with an adoc xref such as:
#   xref:{s-path}/userlog.adoc[Userlog]
# the 'path' key below is the file name of the service page (xxx), the 'name' key is the link text (yyy)
#
# how it is used:
# - envvars starting with 'OCIS_' are global and always point to the special scope envvars page,
#   they are not resolved here
# - all other envvars are matched against the prefixes below, the longest matching prefix wins.
#   this keeps 'STORAGE_USERS_' from being resolved by a shorter 'STORAGE_' prefix
# - if no prefix matches, the 'xxx' and 'yyy' placeholders are kept in the generated table
#   and must be fixed manually. unresolved envvars are printed when the task runs
#
# ADD or CHANGE entries when ocis adds or renames a service.
# the prefix keys MUST be written with their trailing underscore.

